<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}LexOS{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --line: #262a33; --text: #e8e6e1;
      --muted: #9a9ca3; --gold: #c9a35b; --warn: #e0a43a; --bad: #e0675a; --ok: #6cbf8c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
      background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); }
    .brand { font-weight: 650; letter-spacing: .02em; }
    .brand span { color: var(--gold); }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
      margin: 28px 0 10px; font-weight: 600; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .stat b { display: block; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat small { color: var(--muted); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
      margin-bottom: 8px; }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .row + .muted { margin-top: 6px; }
    .ref { color: var(--gold); font-weight: 600; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); font-size: 13px; }
    .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
    .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
    .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
    .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
    .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
    select, input, button { font: inherit; color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    button { background: var(--gold); color: #111; border-color: var(--gold); font-weight: 600; cursor: pointer; }
    .empty { color: var(--muted); padding: 12px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Lex<span>OS</span> AI</div>
    {% block header %}{% endblock %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
