<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Stylized AI legal assistant illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2247"/><stop offset="1" stop-color="#081326"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="50%"><stop offset="0" stop-color="#1877f2" stop-opacity=".55"/><stop offset="1" stop-color="#1877f2" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="85%" cy="12%" r="40%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7db4ff"/><stop offset="1" stop-color="#1877f2"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a6fe0"/><stop offset="1" stop-color="#12388a"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16305e" stop-opacity=".95"/><stop offset="1" stop-color="#0f2447" stop-opacity=".95"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1877f2"/><stop offset="1" stop-color="#5aa0ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#35568c" stroke-opacity=".28"/></pattern>
    <mask id="fade"><radialGradient id="fg" cx="50%" cy="35%" r="65%"><stop offset=".2" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient><rect width="800" height="1000" fill="url(#fg)"/></mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#grid)" mask="url(#fade)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <rect width="800" height="1000" fill="url(#glow2)"/>

  <!-- orbit rings -->
  <g fill="none" stroke="#5aa0ff" stroke-opacity=".28">
    <circle cx="400" cy="380" r="150"/>
    <circle cx="400" cy="380" r="215" stroke-dasharray="3 9"/>
    <circle cx="400" cy="380" r="285" stroke-opacity=".15"/>
  </g>
  <g fill="#5aa0ff">
    <circle cx="615" cy="380" r="6" fill-opacity=".9"/>
    <circle cx="228" cy="236" r="4" fill-opacity=".7"/>
    <circle cx="540" cy="585" r="4" fill-opacity=".6"/>
  </g>

  <!-- shoulders / torso -->
  <path d="M215 640c0-92 80-150 185-150s185 58 185 150v10H215z" fill="url(#body)"/>
  <path d="M215 640c0-92 80-150 185-150s185 58 185 150" fill="none" stroke="#9cc4ff" stroke-opacity=".5" stroke-width="2"/>
  <!-- collar -->
  <path d="M345 497l55 62 55-62" fill="none" stroke="#cfe2ff" stroke-opacity=".6" stroke-width="3" stroke-linejoin="round"/>
  <!-- balance badge -->
  <g transform="translate(468 566)" fill="none" stroke="#e8c168" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0-16V16M-12 16h24M-18-8h36"/>
    <path d="M-18-8l-8 15a8 6 0 0 0 16 0zM18-8l-8 15a8 6 0 0 0 16 0z" stroke-width="2.5"/>
  </g>

  <!-- neck + head -->
  <rect x="372" y="440" width="56" height="60" rx="22" fill="#1d55c0"/>
  <circle cx="400" cy="362" r="112" fill="#1877f2" opacity=".35" filter="url(#soft)"/>
  <rect x="300" y="262" width="200" height="206" rx="96" fill="url(#head)"/>
  <rect x="300" y="262" width="200" height="206" rx="96" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
  <!-- visor face -->
  <rect x="326" y="338" width="148" height="62" rx="31" fill="#0a1d42"/>
  <rect x="326" y="338" width="148" height="62" rx="31" fill="none" stroke="#9cc4ff" stroke-opacity=".5"/>
  <circle cx="368" cy="369" r="9" fill="#7fe3ff"/>
  <circle cx="432" cy="369" r="9" fill="#7fe3ff"/>
  <path d="M378 392q22 12 44 0" fill="none" stroke="#7fe3ff" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
  <!-- antenna -->
  <path d="M400 262v-26" stroke="#9cc4ff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="226" r="9" fill="#e8c168"/>

  <!-- document card -->
  <g>
    <rect x="70" y="700" width="660" height="230" rx="26" fill="url(#card)" stroke="#35568c" stroke-opacity=".8"/>
    <rect x="102" y="732" width="46" height="46" rx="14" fill="#1877f2" fill-opacity=".25"/>
    <path d="M116 745h14l8 8v17a3 3 0 0 1-3 3h-19a3 3 0 0 1-3-3v-22a3 3 0 0 1 3-3z" fill="none" stroke="#9cc4ff" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="166" y="737" width="200" height="14" rx="7" fill="#e6efff" fill-opacity=".85"/>
    <rect x="166" y="762" width="130" height="10" rx="5" fill="#9bb0cf" fill-opacity=".6"/>
    <circle cx="676" cy="754" r="8" fill="#5fd29a"/>
    <rect x="102" y="806" width="596" height="10" rx="5" fill="#9bb0cf" fill-opacity=".35"/>
    <rect x="102" y="830" width="520" height="10" rx="5" fill="#9bb0cf" fill-opacity=".35"/>
    <rect x="102" y="854" width="560" height="10" rx="5" fill="#9bb0cf" fill-opacity=".35"/>
    <rect x="102" y="888" width="596" height="12" rx="6" fill="#0a1d42"/>
    <rect x="102" y="888" width="488" height="12" rx="6" fill="url(#bar)"/>
  </g>
</svg>
